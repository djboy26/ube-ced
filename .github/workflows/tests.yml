name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python: ["3.10", "3.12", "3.13"]}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: pip install -e ".[test]"
      - run: pytest -q
      - run: cd examples/reference_condition && ube-ced run system.yaml --out out && ube-ced battery system.yaml && ube-ced conform .
      - run: cd model/denmark_v5 && python regression_tests.py
